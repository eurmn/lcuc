[package]
name = "lcu-companion"
version = "0.1.1"
description = "LCU Companion Desktop App"
authors = ["you"]
edition = "2021"
default-run = "lcu-companion"

[lib]
name = "lcu_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lcu-companion-agent"
path = "src/bin/lcu-companion-agent.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
base64 = "0.22"
dirs = "6.0"
lazy_static = "1.5"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
incremental = true
opt-level = 0
debug = 1
codegen-units = 256
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
] }
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Globalization",
] }

