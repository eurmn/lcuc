[package]
name = "lcu-companion"
version = "0.1.0"
description = "LCU Companion Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "lcu_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
base64 = "0.22"
dirs = "6.0"
lazy_static = "1.5"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
