<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="htmx-config" content='{"selfRequestsOnly":false}' />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <title>LCU Companion</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body class="dark bg-gray-900 text-gray-100 antialiased selection:bg-purple-600 selection:text-white">
    <div class="h-screen w-screen flex flex-col overflow-hidden bg-gray-900 text-gray-100">
      <!-- Custom Title Bar -->
      <header
        id="titlebar"
        data-tauri-drag-region
        class="h-8 shrink-0 bg-gray-950 border-b border-gray-800 flex items-center justify-between select-none z-50"
      >
        <!-- Left: App Icon & Title -->
        <div class="flex items-center gap-2 px-3 h-full pointer-events-none" data-tauri-drag-region>
          <img src="/src/assets/logo.png" alt="LCU Companion" class="h-4 w-4 object-contain" />
          <span class="text-xs font-semibold text-gray-200 tracking-wide">LCU Companion</span>
        </div>

        <!-- Right: Window Action Buttons -->
        <div class="flex items-center h-full">
          <button
            id="titlebar-minimize"
            type="button"
            class="h-full px-3 text-xs text-gray-400 hover:text-gray-100 hover:bg-gray-800 focus:outline-none transition-colors inline-flex items-center justify-center"
            title="Minimize"
          >
            Minimize
          </button>
          <button
            id="titlebar-maximize"
            type="button"
            class="h-full px-3 text-xs text-gray-400 hover:text-gray-100 hover:bg-gray-800 focus:outline-none transition-colors inline-flex items-center justify-center"
            title="Maximize"
          >
            Maximize
          </button>
          <button
            id="titlebar-close"
            type="button"
            class="h-full px-3 text-xs text-gray-400 hover:text-white hover:bg-red-600 focus:outline-none transition-colors inline-flex items-center justify-center"
            title="Close"
          >
            Close
          </button>
        </div>
      </header>

      <!-- Main App Body Shell -->
      <div id="app-shell" class="flex-1 flex overflow-hidden bg-gray-900 text-gray-100 relative">
        <!-- Left Sidebar: Profile Card & Rune Pages -->
        <aside class="w-full max-w-sm shrink-0 border-r border-gray-800 bg-gray-900/60 overflow-y-auto h-full">
        <div class="h-full p-4 flex flex-col gap-4">
          <!-- Summoner Profile Card Container -->
          <div
            id="profile-card-container"
            class="w-full rounded-2xl border border-gray-800 bg-gray-900/80 p-3.5"
            hx-get="command:ui_profile_card"
            hx-trigger="load"
            hx-swap="outerHTML"
          >
            <div class="flex animate-pulse items-center gap-3">
              <div class="h-12 w-12 shrink-0 rounded-full border border-gray-700 bg-gray-800"></div>
              <div class="min-w-0 flex-1">
                <div class="h-2.5 w-16 rounded-full bg-gray-800"></div>
                <div class="mt-1.5 h-3.5 w-24 rounded-full bg-gray-700"></div>
              </div>
            </div>
          </div>

          <!-- Horizontal Separator -->
          <hr class="border-gray-800" />

          <!-- Saved Runes List Container -->
          <div
            id="saved-runes-container"
            hx-get="command:ui_runesets"
            hx-trigger="load"
            hx-swap="outerHTML"
          >
            <div class="space-y-6 animate-pulse">
              <div>
                <div class="mb-3 flex items-center justify-between px-1">
                  <div class="flex items-center gap-2">
                    <span class="flex h-2 w-2 rounded-full bg-gray-700"></span>
                    <div class="h-3 w-28 rounded-full bg-gray-700"></div>
                  </div>
                  <div class="h-4 w-6 rounded-full bg-gray-800"></div>
                </div>
                <ul class="space-y-2">
                  <li class="rounded-2xl border border-gray-800 bg-gray-900/60 p-3">
                    <div class="flex items-center gap-3">
                      <div class="h-10 w-10 rounded-xl bg-gray-800"></div>
                      <div class="flex-1 min-w-0">
                        <div class="h-3.5 w-28 rounded-full bg-gray-700"></div>
                        <div class="mt-2 h-2.5 w-16 rounded-full bg-gray-800"></div>
                      </div>
                    </div>
                  </li>
                  <li class="rounded-2xl border border-gray-800 bg-gray-900/60 p-3">
                    <div class="flex items-center gap-3">
                      <div class="h-10 w-10 rounded-xl bg-gray-800"></div>
                      <div class="flex-1 min-w-0">
                        <div class="h-3.5 w-32 rounded-full bg-gray-700"></div>
                        <div class="mt-2 h-2.5 w-20 rounded-full bg-gray-800"></div>
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
              <div>
                <div class="mb-3 flex items-center justify-between px-1">
                  <div class="flex items-center gap-2">
                    <span class="flex h-2 w-2 rounded-full bg-gray-700"></span>
                    <div class="h-3 w-32 rounded-full bg-gray-700"></div>
                  </div>
                  <div class="h-4 w-6 rounded-full bg-gray-800"></div>
                </div>
                <ul class="space-y-2">
                  <li class="rounded-2xl border border-gray-800 bg-gray-900/60 p-3">
                    <div class="flex items-center gap-3">
                      <div class="h-10 w-10 rounded-xl bg-gray-800"></div>
                      <div class="flex-1 min-w-0">
                        <div class="h-3.5 w-24 rounded-full bg-gray-700"></div>
                        <div class="mt-2 h-2.5 w-28 rounded-full bg-gray-800"></div>
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Center Rune Canvas -->
      <main class="flex-1 flex items-center justify-center bg-gray-900 p-6 overflow-y-auto h-full relative">
        <!-- Center Rune Tree Section -->
        <div
          id="current-rune-tree-container"
          class="w-full max-w-4xl mx-auto animate-pulse rounded-xl bg-gray-900 p-5 my-auto"
          hx-get="command:ui_rune_tree_current"
          hx-trigger="load"
          hx-swap="outerHTML"
        >
          <!-- Card Top Bar Skeleton -->
          <div class="mb-4 flex items-center justify-between gap-4 border-b border-gray-800 pb-3">
            <div class="h-5 w-44 rounded-full bg-gray-800"></div>
          </div>

          <div class="flex flex-row gap-5 items-start">
            <!-- Left Column: Primary Rune Tree Skeleton -->
            <div class="flex-1 min-w-0">
              <article class="rounded-xl border border-gray-800 bg-gray-950/80 p-4">
                <!-- Style Header Skeleton -->
                <div class="mb-3 flex items-center gap-2">
                  <div class="h-6 w-6 rounded bg-gray-800"></div>
                  <div class="h-4 w-28 rounded-full bg-gray-700"></div>
                </div>
                <div class="space-y-3">
                  <!-- Keystones Skeleton (Big Icons, centered, no card) -->
                  <div class="flex flex-wrap items-center justify-center gap-4 py-2 pb-3">
                    <div class="h-20 w-20 rounded-full border border-gray-700 bg-gray-800"></div>
                    <div class="h-20 w-20 rounded-full border border-gray-700 bg-gray-800"></div>
                    <div class="h-20 w-20 rounded-full border border-gray-700 bg-gray-800"></div>
                  </div>

                  <!-- Tier 1 Slot Skeleton -->
                  <div class="rounded-lg border border-gray-800/80 bg-gray-900/90 p-3">
                    <div class="mb-2 h-2.5 w-16 rounded-full bg-gray-800"></div>
                    <div class="flex flex-wrap items-center justify-center gap-3">
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                    </div>
                  </div>

                  <!-- Tier 2 Slot Skeleton -->
                  <div class="rounded-lg border border-gray-800/80 bg-gray-900/90 p-3">
                    <div class="mb-2 h-2.5 w-14 rounded-full bg-gray-800"></div>
                    <div class="flex flex-wrap items-center justify-center gap-3">
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                    </div>
                  </div>

                  <!-- Tier 3 Slot Skeleton -->
                  <div class="rounded-lg border border-gray-800/80 bg-gray-900/90 p-3">
                    <div class="mb-2 h-2.5 w-16 rounded-full bg-gray-800"></div>
                    <div class="flex flex-wrap items-center justify-center gap-3">
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                    </div>
                  </div>
                </div>
              </article>
            </div>

            <!-- Right Column: Secondary Rune Tree + Stat Mods Skeleton -->
            <div class="flex-1 min-w-0 flex flex-col gap-4">
              <!-- Secondary Tree Skeleton -->
              <article class="rounded-xl border border-gray-800 bg-gray-950/80 p-4">
                <!-- Style Header Skeleton -->
                <div class="mb-3 flex items-center gap-2">
                  <div class="h-6 w-6 rounded bg-gray-800"></div>
                  <div class="h-4 w-28 rounded-full bg-gray-700"></div>
                </div>
                <div class="space-y-3">
                  <!-- Tier 1 Slot Skeleton -->
                  <div class="rounded-lg border border-gray-800/80 bg-gray-900/90 p-3">
                    <div class="mb-2 h-2.5 w-16 rounded-full bg-gray-800"></div>
                    <div class="flex flex-wrap items-center justify-center gap-3">
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                    </div>
                  </div>

                  <!-- Tier 2 Slot Skeleton -->
                  <div class="rounded-lg border border-gray-800/80 bg-gray-900/90 p-3">
                    <div class="mb-2 h-2.5 w-14 rounded-full bg-gray-800"></div>
                    <div class="flex flex-wrap items-center justify-center gap-3">
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                      <div class="h-11 w-11 rounded-full border border-gray-700 bg-gray-800"></div>
                    </div>
                  </div>
                </div>
              </article>

              <!-- Stat Mods Skeleton -->
              <article class="rounded-xl border border-gray-800 bg-gray-900 p-4">
                <div class="mb-3 flex items-center gap-2">
                  <div class="h-4 w-20 rounded-full bg-gray-700"></div>
                </div>
                <div class="space-y-2">
                  <!-- Stat Tier 1 -->
                  <div class="flex items-center justify-center gap-3 py-1">
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                  </div>
                  <!-- Stat Tier 2 -->
                  <div class="flex items-center justify-center gap-3 py-1">
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                  </div>
                  <!-- Stat Tier 3 -->
                  <div class="flex items-center justify-center gap-3 py-1">
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                    <div class="h-8 w-8 rounded-full border border-transparent bg-gray-800"></div>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </div>
      </main>
    </div>
    </div>
  </body>
</html>
